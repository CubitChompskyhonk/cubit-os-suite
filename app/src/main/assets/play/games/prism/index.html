<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Project Prism — Phase A</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #05060a; color: #d8dde8; font-family: ui-monospace, monospace; overflow: hidden; height: 100dvh; }
    #wrap { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; background: #000; }
    #hud {
      position: absolute; left: 0; right: 0; top: 0; padding: 8px 10px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
      pointer-events: none; font-size: 11px; letter-spacing: 0.04em; z-index: 5;
    }
    #hud b { color: #3dd68c; }
    #bar {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 10px;
      background: rgba(8,10,16,0.92); border-top: 1px solid #2a3142; z-index: 6;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    }
    #bar button, #bar label {
      font: 600 11px system-ui; padding: 8px 10px; border-radius: 8px;
      border: 1px solid #2a3142; background: #141a24; color: #eef1f6;
    }
    #bar button.primary { border-color: #5b8cff; background: #1a3050; }
    #bar .tog { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #8b93a7; }
    #msg { position: absolute; left: 10px; right: 10px; top: 48px; font-size: 12px; color: #8b93a7; z-index: 5; pointer-events: none; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="hud"><b>PRISM · PHASE A</b> · <span id="fps">--</span> fps · ents <span id="ents">0</span> · <span id="res">320×240</span></div>
    <div id="msg">Greybox arena — drag/touch to look · WASD/arrows move · packs below</div>
    <div id="bar">
      <button type="button" class="primary" id="bench">Run 5s bench</button>
      <label class="tog"><input type="checkbox" id="crt" checked /> CRT</label>
      <label class="tog"><input type="checkbox" id="fog" checked /> Fog</label>
      <label class="tog"><input type="checkbox" id="particles" checked /> Particles</label>
      <label class="tog"><input type="checkbox" id="flock" checked /> Flock</label>
      <button type="button" id="console">Console</button>
    </div>
  </div>
  <script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const INTERNAL_W = 320, INTERNAL_H = 240;
  const off = document.createElement('canvas');
  off.width = INTERNAL_W; off.height = INTERNAL_H;
  const g = off.getContext('2d', { alpha: false });

  let yaw = 0.4, pitch = 0.15;
  let px = 0, pz = 8;
  let keys = {};
  let particles = [];
  let flock = [];
  let last = performance.now();
  let frames = 0, fps = 0, fpsT = 0;
  let benchUntil = 0, benchFrames = 0, benchAcc = 0;

  for (let i = 0; i < 80; i++) {
    particles.push({
      x: (Math.random() - 0.5) * 40,
      y: Math.random() * 8,
      z: (Math.random() - 0.5) * 40,
      vy: 0.2 + Math.random() * 0.5
    });
  }
  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * Math.PI * 2;
    flock.push({
      x: Math.cos(a) * 6, y: 1.2 + Math.random(), z: Math.sin(a) * 6,
      a, sp: 0.8 + Math.random() * 0.6
    });
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(canvas.clientWidth * dpr);
    canvas.height = Math.floor(canvas.clientHeight * dpr);
  }
  window.addEventListener('resize', resize);
  setTimeout(resize, 50);

  // pointer look
  let dragging = false, lx = 0, ly = 0;
  canvas.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointerup', () => { dragging = false; });
  canvas.addEventListener('pointermove', e => {
    if (!dragging) return;
    yaw += (e.clientX - lx) * 0.005;
    pitch += (e.clientY - ly) * 0.004;
    pitch = Math.max(-1.2, Math.min(1.2, pitch));
    lx = e.clientX; ly = e.clientY;
  });
  window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  function project(x, y, z) {
    // camera transform
    let cx = x - px, cy = y - 1.6, cz = z - pz;
    const cosy = Math.cos(yaw), siny = Math.sin(yaw);
    let rx = cx * cosy - cz * siny;
    let rz = cx * siny + cz * cosy;
    const cosp = Math.cos(pitch), sinp = Math.sin(pitch);
    let ry = cy * cosp - rz * sinp;
    rz = cy * sinp + rz * cosp;
    if (rz < 0.15) return null;
    const f = 180 / rz;
    return { x: INTERNAL_W / 2 + rx * f, y: INTERNAL_H / 2 - ry * f, s: f, z: rz };
  }

  function drawTri(p0, p1, p2, col) {
    if (!p0 || !p1 || !p2) return;
    g.beginPath();
    g.moveTo(p0.x, p0.y); g.lineTo(p1.x, p1.y); g.lineTo(p2.x, p2.y); g.closePath();
    g.fillStyle = col; g.fill();
  }

  function drawBox(x, y, z, w, h, d, col) {
    const v = [
      [x, y, z], [x+w, y, z], [x+w, y, z+d], [x, y, z+d],
      [x, y+h, z], [x+w, y+h, z], [x+w, y+h, z+d], [x, y+h, z+d]
    ].map(p => project(p[0], p[1], p[2]));
    // simple faces (painter approx by z)
    const faces = [
      [0,1,2,3], [4,5,6,7], [0,1,5,4], [1,2,6,5], [2,3,7,6], [3,0,4,7]
    ];
    const order = faces.map((f, i) => {
      const zs = f.map(idx => v[idx] && v[idx].z).filter(Boolean);
      return { i, z: zs.length ? zs.reduce((a,b)=>a+b,0)/zs.length : 0 };
    }).sort((a,b) => b.z - a.z);
    order.forEach(({ i }, n) => {
      const f = faces[i];
      const pts = f.map(idx => v[idx]);
      if (pts.some(p => !p)) return;
      const shade = 0.55 + (n / 12);
      const c = col;
      // parse and shade
      g.beginPath();
      g.moveTo(pts[0].x, pts[0].y);
      for (let k = 1; k < pts.length; k++) g.lineTo(pts[k].x, pts[k].y);
      g.closePath();
      g.fillStyle = c;
      g.globalAlpha = shade;
      g.fill();
      g.globalAlpha = 1;
    });
  }

  function drawFloor() {
    for (let i = -8; i <= 8; i++) {
      for (let j = -8; j <= 8; j++) {
        if ((i + j) & 1) continue;
        const p00 = project(i, 0, j), p10 = project(i+1, 0, j), p11 = project(i+1, 0, j+1), p01 = project(i, 0, j+1);
        drawTri(p00, p10, p11, '#1a2230');
        drawTri(p00, p11, p01, '#151b28');
      }
    }
  }

  function tick(dt) {
    const sp = 6 * dt;
    const cosy = Math.cos(yaw), siny = Math.sin(yaw);
    let mx = 0, mz = 0;
    if (keys['w'] || keys['arrowup']) { mx += siny; mz += cosy; }
    if (keys['s'] || keys['arrowdown']) { mx -= siny; mz -= cosy; }
    if (keys['a'] || keys['arrowleft']) { mx -= cosy; mz += siny; }
    if (keys['d'] || keys['arrowright']) { mx += cosy; mz -= siny; }
    const len = Math.hypot(mx, mz) || 1;
    px += (mx / len) * sp;
    pz += (mz / len) * sp;

    if (document.getElementById('particles').checked) {
      particles.forEach(p => {
        p.y += p.vy * dt;
        if (p.y > 9) p.y = 0;
      });
    }
    if (document.getElementById('flock').checked) {
      flock.forEach(b => {
        b.a += b.sp * dt;
        b.x = Math.cos(b.a) * 6;
        b.z = Math.sin(b.a) * 6;
        b.y = 1.5 + Math.sin(b.a * 3) * 0.4;
      });
    }
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    tick(dt);

    frames++;
    fpsT += dt;
    if (fpsT >= 0.5) {
      fps = Math.round(frames / fpsT);
      frames = 0; fpsT = 0;
      document.getElementById('fps').textContent = String(fps);
    }
    if (now < benchUntil) {
      benchFrames++;
      benchAcc += fps;
    } else if (benchUntil && now >= benchUntil) {
      const avg = Math.round(benchAcc / Math.max(1, benchFrames));
      document.getElementById('msg').textContent = 'Bench done · avg ~' + avg + ' fps · ents ' + entityCount();
      benchUntil = 0;
      try {
        localStorage.setItem('prism_bench', JSON.stringify({ avg, ts: Date.now(), phase: 'A' }));
      } catch (e) {}
    }

    // clear
    g.fillStyle = '#070a12';
    g.fillRect(0, 0, INTERNAL_W, INTERNAL_H);

    // sky gradient
    const sky = g.createLinearGradient(0, 0, 0, INTERNAL_H * 0.55);
    sky.addColorStop(0, '#0c1220');
    sky.addColorStop(1, '#1a1030');
    g.fillStyle = sky;
    g.fillRect(0, 0, INTERNAL_W, INTERNAL_H * 0.55);

    drawFloor();

    // central prism monument (low poly)
    drawBox(-1, 0, -1, 2, 3.5, 2, '#5b8cff');
    drawBox(-0.4, 3.5, -0.4, 0.8, 1.2, 0.8, '#9ec0ff');

    // pillars
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      drawBox(Math.cos(a) * 10 - 0.4, 0, Math.sin(a) * 10 - 0.4, 0.8, 4, 0.8, '#2a3548');
    }

    if (document.getElementById('flock').checked) {
      flock.forEach(b => {
        const p = project(b.x, b.y, b.z);
        if (!p) return;
        g.fillStyle = '#c9a227';
        g.fillRect(p.x - 2, p.y - 2, 4, 4);
      });
    }

    if (document.getElementById('particles').checked) {
      g.fillStyle = 'rgba(200,220,255,0.7)';
      particles.forEach(p => {
        const pr = project(p.x, p.y, p.z);
        if (!pr) return;
        g.fillRect(pr.x, pr.y, 1, 1);
      });
    }

    if (document.getElementById('fog').checked) {
      const fog = g.createLinearGradient(0, INTERNAL_H * 0.4, 0, INTERNAL_H);
      fog.addColorStop(0, 'rgba(10,14,24,0)');
      fog.addColorStop(1, 'rgba(10,14,24,0.75)');
      g.fillStyle = fog;
      g.fillRect(0, 0, INTERNAL_W, INTERNAL_H);
    }

    // blit upscale
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(off, 0, 0, canvas.width, canvas.height);

    if (document.getElementById('crt').checked) {
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      for (let y = 0; y < canvas.height; y += 3) ctx.fillRect(0, y, canvas.width, 1);
    }

    document.getElementById('ents').textContent = String(entityCount());
    requestAnimationFrame(frame);
  }

  function entityCount() {
    let n = 7 + 6; // prism + pillars approx
    if (document.getElementById('particles').checked) n += particles.length;
    if (document.getElementById('flock').checked) n += flock.length;
    return n;
  }

  document.getElementById('bench').onclick = () => {
    benchUntil = performance.now() + 5000;
    benchFrames = 0; benchAcc = 0;
    document.getElementById('msg').textContent = 'Benchmark running (5s)…';
  };
  document.getElementById('console').onclick = () => {
    location.href = '../../index.html';
  };

  try {
    localStorage.setItem('cubit_play_session', JSON.stringify({
      schema: 1, console: 'Cubit Play', game: 'prism', profile: 'n64-class', phase: 'A', ts: Date.now()
    }));
  } catch (e) {}

  requestAnimationFrame(frame);
})();
  </script>
</body>
</html>
