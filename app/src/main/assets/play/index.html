<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cubit Play</title>
  <style>
    :root { --bg:#0b0e14; --card:#121826; --line:#2a3142; --text:#e8ecf4; --mute:#8b93a7; --ok:#3dd68c; --gold:#c9a227; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; padding: 18px 14px 32px; }
    .brand { color: var(--gold); font-size: 0.68rem; font-weight: 800; letter-spacing: 0.14em; }
    h1 { font-size: 1.5rem; margin: 6px 0 4px; }
    .sub { color: var(--mute); font-size: 0.8rem; margin-bottom: 14px; }
    .stack { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
    button {
      width: 100%; padding: 16px; border-radius: 12px; border: 1px solid var(--line);
      background: var(--card); color: var(--text); font-weight: 700; font-size: 1rem;
    }
    button.primary { border-color: var(--gold); background: #1a1810; color: #f0e6c8; }
    #log { max-width: 480px; margin: 12px auto 0; font-family: monospace; font-size: 0.7rem; color: var(--mute); }
  </style>
</head>
<body>
  <div class="brand">CUBIT PLAY · ENGINE SHARED</div>
  <h1>Console menu</h1>
  <p class="sub">Cubit HQ · FPS · Glow · Maze · catalog live</p>
  <div class="stack">
    <button type="button" class="primary" id="btnHq">Cubit HQ</button>
    <button type="button" class="primary" id="btnTank">Cubit FPS</button>
    <button type="button" class="primary" id="btnGlow3d">Under the Glow 3D</button>
    <button type="button" class="primary" id="btnMaze">Cubit Maze</button>
    <button type="button" id="btnPrism">Project Prism</button>
    <button type="button" id="btnGlow">Glow (classic)</button>
    <button type="button" id="btnOs">OS Home</button>
  </div>
  <div id="log"></div>
  <script>
(function () {
  function log(m) {
    var el = document.getElementById('log');
    if (el) el.textContent += m + '\n';
  }
  function openNative(id, url) {
    log('Open ' + id);
    try {
      if (window.CubitOS && window.CubitOS.openGame) { window.CubitOS.openGame(id); return; }
    } catch (e) { log('bridge ' + e); }
    location.href = url;
  }
  function bind(id, fn) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('click', function (e) { e.preventDefault(); fn(); });
  }
  bind('btnHq', function () { openNative('hq', 'games/hq/index.html'); });
  bind('btnTank', function () { openNative('tank-wars', 'games/tank-wars/index.html'); });
  bind('btnGlow3d', function () { openNative('glow3d', 'games/glow3d/index.html'); });
  bind('btnMaze', function () { openNative('maze', 'games/maze/index.html'); });
  bind('btnPrism', function () { openNative('prism', 'games/prism/index.html'); });
  bind('btnGlow', function () {
    openNative('under-the-glow', 'games/under-the-glow/index.html?access=founder&play=1&console=cubit');
  });
  bind('btnOs', function () {
    try { if (window.CubitOS && window.CubitOS.openOsHome) { window.CubitOS.openOsHome(''); return; } } catch (e) {}
    location.href = '../index.html';
  });
  log('Play menu ready');
})();
  </script>
</body>
</html>
