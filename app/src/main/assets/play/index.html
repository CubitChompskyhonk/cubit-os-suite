<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cubit Play</title>
  <style>
    :root { --bg:#0b0e14; --card:#121826; --line:#2a3142; --text:#e8ecf4; --mute:#8b93a7; --ok:#3dd68c; --gold:#c9a227; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; padding: 18px 14px 32px; }
    .brand { color: var(--gold); font-size: 0.68rem; font-weight: 800; letter-spacing: 0.14em; }
    h1 { font-size: 1.5rem; margin: 6px 0 4px; }
    .sub { color: var(--mute); font-size: 0.8rem; margin-bottom: 14px; line-height: 1.4; }
    .stack { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
    button {
      width: 100%; padding: 16px; border-radius: 12px; border: 1px solid var(--line);
      background: var(--card); color: var(--text); font-weight: 700; font-size: 1rem;
    }
    button.primary { border-color: var(--gold); background: #1a1810; color: #f0e6c8; }
    .game { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
    .game h2 { font-size: 1rem; margin: 4px 0; }
    .game p { color: var(--mute); font-size: 0.78rem; margin-bottom: 10px; }
    .tag { font-size: 0.65rem; color: var(--ok); letter-spacing: 0.06em; }
    #log { max-width: 480px; margin: 12px auto 0; font-family: monospace; font-size: 0.7rem; color: var(--mute); white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="brand">CUBIT PLAY · VIRTUAL CONSOLE</div>
  <h1>Console menu</h1>
  <p class="sub">Tap a game · full screen · device Back returns here</p>
  <div class="stack">
    <button type="button" class="primary" id="btnMaze">Play Cubit Maze</button>
    <button type="button" class="primary" id="btnPrism">Play Project Prism</button>
    <button type="button" class="primary" id="btnGlow">Play Under the Glow</button>
    <button type="button" id="btnOs">OS Home</button>
  </div>
  <div class="stack" style="margin-top:14px">
    <div class="game">
      <div class="tag">3D · WASD</div>
      <h2>Cubit Maze</h2>
      <p>Find the gold exit · touch pad + look drag</p>
      <button type="button" class="primary" id="startMaze">Start</button>
    </div>
  </div>
  <div id="log"></div>
  <script>
(function () {
  function log(m) {
    var el = document.getElementById('log');
    if (el) el.textContent += m + '\n';
  }
  function openNative(gameId, fileUrl) {
    log('Open ' + gameId);
    try {
      if (window.CubitOS && typeof window.CubitOS.openGame === 'function') {
        window.CubitOS.openGame(gameId);
        return;
      }
    } catch (e) { log('bridge ' + e); }
    window.location.href = fileUrl;
  }
  function bind(id, fn) {
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('click', function (ev) { ev.preventDefault(); fn(); }, false);
  }
  bind('btnMaze', function () { openNative('maze', 'games/maze/index.html'); });
  bind('startMaze', function () { openNative('maze', 'games/maze/index.html'); });
  bind('btnPrism', function () { openNative('prism', 'games/prism/index.html'); });
  bind('btnGlow', function () {
    openNative('under-the-glow', 'games/under-the-glow/index.html?access=founder&play=1&console=cubit');
  });
  bind('btnOs', function () {
    try {
      if (window.CubitOS && window.CubitOS.openOsHome) { window.CubitOS.openOsHome(''); return; }
    } catch (e) {}
    window.location.href = '../index.html';
  });
  log('Play menu ready');
})();
  </script>
</body>
</html>
